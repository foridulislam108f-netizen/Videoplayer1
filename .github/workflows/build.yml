name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip and build
        run: |
          mkdir work
          unzip -q Videoplayer1.zip -d work
          DIR=$(dirname "$(find work -name settings.gradle | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Videoplayer1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Videoplayer1-apk
          path: out/Videoplayer1.apk
