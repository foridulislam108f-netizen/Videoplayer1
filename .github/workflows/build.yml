name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoPlayerPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayerPro-apk
          path: VideoPlayerPro.apk

      - name: Publish latest APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest VideoPlayerPro.apk \
            --title "VideoPlayerPro (build ${{ github.run_number }})" \
            --notes "Latest build #${{ github.run_number }}. Download VideoPlayerPro.apk and install it over the old app." \
            --target "${{ github.sha }}" \
            --latest
