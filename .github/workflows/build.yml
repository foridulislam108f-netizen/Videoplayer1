name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project folder (unzips the zip if needed)
        run: |
          find_settings() {
            find . -maxdepth 5 -name 'settings.gradle*' -not -path './.git/*' | head -n 1
          }
          SETTINGS=$(find_settings)
          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project in repo - looking for a zip file..."
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No settings.gradle and no zip file found. Files in repo:"
              find . -maxdepth 3 -not -path './.git/*' | head -50
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            cd "$RUNNER_TEMP/src"
            SETTINGS=$(find_settings)
            if [ -z "$SETTINGS" ]; then echo "settings.gradle not found inside the zip"; exit 1; fi
          fi
          DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "Project folder: $DIR"
          ls "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" VideoPlayerPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayerPro-apk
          path: VideoPlayerPro.apk

      - name: Publish latest APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest VideoPlayerPro.apk \
            --title "VideoPlayerPro (build ${{ github.run_number }})" \
            --notes "Version 3.2 - build ${{ github.run_number }}. Download VideoPlayerPro.apk and install it over the old app." \
            --target "${{ github.sha }}" \
            --latest
